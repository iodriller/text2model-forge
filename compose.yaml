name: vettedmesh

services:
  studio:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VETTEDMESH_SOURCE_REVISION: ${VETTEDMESH_SOURCE_REVISION:-}
    init: true
    restart: unless-stopped
    ports:
      # Studio has no account system. Keep it reachable only from this host.
      - "127.0.0.1:${VETTEDMESH_PORT:-8766}:8766"
    volumes:
      - vettedmesh-workspace:/workspace
      - type: bind
        source: ${VETTEDMESH_DOCKER_CONFIG:-./docker/config.local.toml}
        target: /app/config.local.toml
        read_only: true
    extra_hosts:
      # Works on Docker Desktop and Docker Engine 20.10+.
      - "host.docker.internal:host-gateway"
    depends_on:
      ollama:
        condition: service_healthy

  ollama:
    image: ollama/ollama:0.32.4@sha256:10c13eb515db310990527d36ca14a136da4bcc0fbf2bf3b15e9c1f111e9d3cd4
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${VETTEDMESH_OLLAMA_PORT:-11434}:11434"
    volumes:
      - vettedmesh-ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s

  reviewer-model:
    image: ollama/ollama:0.32.4@sha256:10c13eb515db310990527d36ca14a136da4bcc0fbf2bf3b15e9c1f111e9d3cd4
    restart: "no"
    environment:
      OLLAMA_HOST: http://ollama:11434
    command: ["pull", "qwen3-vl:8b-instruct"]
    depends_on:
      ollama:
        condition: service_healthy

volumes:
  vettedmesh-workspace:
  vettedmesh-ollama:
