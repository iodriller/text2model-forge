[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ember-asset-forge"
version = "0.1.0"
description = "Local-first, provenance-aware 3D-to-sprite production studio"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["Pillow==11.3.0"]

[project.scripts]
assetforge = "assetforge.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["assetforge*"]
