[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "asset-forge-darkness"
version = "0.1.0"
description = "Independent, evidence-driven AI asset compiler"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "Pillow>=10,<13",
  "pydantic>=2.8,<3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["darkness*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
