# Advanced profile: every stage parameter is expected to be hand-tuned.
# Select with `forge studio --profile advanced`. Copy this file under a new
# name (e.g. profiles/my-project.toml) to keep a project-specific set of
# overrides -- any file in profiles/ is a valid --profile argument.
#
# Only override keys base.toml marks WIRED; anything under
# [adapter_defaults] is a reference for hand-invoked scripts and is not read
# by the pipeline, so overriding it here would do nothing.

[asset]
quality = "high"

[optimizer]
enabled = true
mode = "advise"                       # still proposes only; "auto" applies without a human look

# Higher-fidelity geometry and larger diagnostic renders, at the cost of time.
# The standard Hunyuan3D checkpoint (~6GB) and a finer octree still fit in 8GB;
# raise octree_resolution before anything else if the mesh looks blobby.
[stages.D2]
checkpoint = "hunyuan3d-dit-v2.safetensors"
octree_resolution = 384
steps = 75
decimation_target = 500000
texture_size = 4096

[stages.D3]
render_size = 768

[stages.D4]
render_size = 768

[stages.D9]
render_size = 1024
