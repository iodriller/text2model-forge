# Asset Forge base configuration.
#
# Every setting the tool understands, with its default value and meaning,
# lives in this file. profiles/simple.toml and profiles/advanced.toml (or a
# profile you add) overlay this file; config.local.toml's [studio_defaults]
# table can override machine-wide; a run's own settings win last. Run
# `forge config show --profile <name>` to see the fully resolved values and
# which layer set each one.
#
# Sections marked WIRED are read by darkness/studio_pipeline.py today.
# Sections marked DOCUMENTED are the agreed parameter surface for a stage
# but are not yet read from this file at every adapter call site -- those
# adapters still carry their own hardcoded argparse defaults, which this
# file's values currently mirror. Wiring each remaining call site through
# this resolver is real, tracked follow-up work, not done blind against
# adapters that need a live Blender/ComfyUI/GPU worker to verify safely.
#
# [quality.*] is WIRED only for concept_steps/concept_cfg (they reach
# concept_workflow() in studio_pipeline.py's D1/D2 calls); sprite_views in
# the same sections is still DOCUMENTED -- D9's sprite renderer is a Blender
# subprocess this environment cannot verify against.

[studio]                              # WIRED -- StudioRun construction
model = "qwen3_6_27b"                 # LocalDeploy/Ollama model id for Qwen review and the optimizer
comfy_url = "http://127.0.0.1:8188"
localdeploy_url = "http://127.0.0.1:8000/v1"
concept_backend = "auto"              # auto | qwen_image_2512 | qwen_image_edit_2511 | sdxl
checkpoint = "dreamshaper_xl_v2_turbo.safetensors"
style_lora = "Warcraft style.safetensors"
style_lora_strength = 0.8
style_lora_trigger = "World of Warcraft cinematic style"
prop_lora = ""
prop_lora_strength = 0.6

[optimizer]                           # DOCUMENTED -- see adapters/optimize_short_biped_rig.py
# The LLM optimizer (darkness/optimizer.py) is a separate, explicitly
# invoked research loop today, not an automatic step inside D0-D10. Its
# first six-attempt episode retained the baseline rather than improving
# it, so "enabled" here documents intent for when/if it is wired into the
# main flow; it does not currently gate anything in studio_pipeline.py.
enabled = false
mode = "advise"                       # advise (propose only) | auto (apply without a human look)
max_attempts = 2                      # matches LocalDeployOptimizer's structured-output retry budget

[asset]                               # DOCUMENTED -- simple-tier request shape
asset_kind = "character"              # character | creature | prop | architecture | environment | material | vfx
behavior = "deformable_animated"      # static | rigid_articulated | deformable_animated | simulated
animated = true
animations = []                       # clip ids; empty means "use the asset kind's defaults"
quality = "standard"                  # draft | standard | high -- see [quality.*] below

[quality.draft]                       # WIRED -- concept_steps/concept_cfg feed concept_workflow()
concept_steps = 20
concept_cfg = 5.0
sprite_views = 4

# concept_steps/concept_cfg here are darkness/studio_comfy.py concept_workflow()'s
# own long-standing defaults (steps=30, cfg=6.0), not new values -- "standard"
# quality must reproduce today's real generation behavior exactly, since a
# different number here is a visual change nobody in this environment can see.
[quality.standard]                    # WIRED -- concept_steps/concept_cfg feed concept_workflow()
concept_steps = 30
concept_cfg = 6.0
sprite_views = 4

[quality.high]                        # WIRED -- concept_steps/concept_cfg feed concept_workflow()
concept_steps = 45
concept_cfg = 7.0
sprite_views = 8

# -- Per-stage settings, read by StudioCoordinator._stage_settings(). --------
# A run pins WHICH profile it uses (StudioRun.profile), not a frozen copy of
# these values, so editing one takes effect on that run's next attempt.
# Every key below is read by the stage it names; anything not genuinely
# consumed lives in [adapter_defaults] at the bottom instead of pretending
# to be pipeline configuration.

[stages.D2]                           # WIRED -- image-to-3D
# D2 turns the concept image YOU APPROVED at D1 into a mesh. The approved
# image is the input; D2 does not render a new one.
#
# backend = "hunyuan3d" uses ComfyUI's native Hunyuan3D-2 support: no custom
# nodes, ~5GB VRAM for the mini checkpoint and ~6GB for the standard one.
# That is what makes this step reachable on an 8GB consumer GPU at all --
# TRELLIS.2-4B needs 16-24GB and simply cannot run there.
#
# Set backend to a worker id ("trellis2.4b", "triposg.1.5b",
# "canonical.short_biped") to route through the typed subprocess worker
# protocol instead, on a machine with the VRAM for it.
backend = "hunyuan3d"
checkpoint = "hunyuan3d-dit-v2-mini.safetensors"   # or hunyuan3d-dit-v2.safetensors (~6GB)
steps = 50
cfg = 5.0
octree_resolution = 256               # 128 is faster/coarser, 384 finer and slower
seed = 7132026
timeout_seconds = 1800
# Only read when backend is a subprocess worker, not for hunyuan3d:
worker_id = "trellis2.4b"
decimation_target = 300000
texture_size = 2048

[stages.D3]                           # WIRED -- Blender cleanup
render_size = 512
maximum_material_change_fraction = 0.03
weld_distance = 0.00005               # deformable assets only; static uses 0.0
timeout_seconds = 900

[stages.D4]                           # WIRED -- canonical structure / rig probe
render_size = 512
maximum_material_change_fraction = 0.03
maximum_bone_influences = 4
timeout_seconds = 1200

[stages.D7]                           # WIRED -- motion (timeout only)
timeout_seconds = 3600
# WIRED. Names a clip_id in motion_library/catalog.json (copy
# catalog.example.json to create one). Empty keeps the historical default:
# the qualified CC0 clip under workspace_root/sources/. An id that is unknown
# or whose file has not been downloaded fails loudly rather than silently
# retargeting a motion you did not choose.
donor_motion_id = ""

[stages.D9]                           # WIRED -- delivery render (static/prop path)
render_size = 768
timeout_seconds = 900

# -- Adapter CLI defaults ----------------------------------------------------
# These mirror the argparse defaults of standalone scripts under adapters/,
# invoked by hand (see docs/darkness-worker-guide.md). The D0-D10 pipeline
# does NOT read them: D2b is not a pipeline stage at all, and D6/D10 adopt
# hash-bound upstream output rather than running a worker of their own.
# Kept here as one reference for the numbers, explicitly NOT as live config.
[adapter_defaults.retopology]         # adapters/build_retopology_request.py
worker_id = "autoremesher"
target_quads = 20000
minimum_quad_fraction = 0.99

[adapter_defaults.sprites]            # adapters/package_motion_sprites.py
lod_levels = 2
atlas_size = 2048

[adapter_defaults.unity]              # unity_smoke_template/ProjectSettings
unity_version = "6000.5.1f1"
