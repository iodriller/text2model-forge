[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "asset-forge"
version = "0.1.0"
description = "Text-to-3D asset compiler: description in, human-gated animated asset out."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27,<1",
  "networkx>=3,<4",
  "numpy>=1.26,<3",
  "Pillow>=12.3,<13",
  "pydantic>=2.8,<3",
  "trimesh>=4.4,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  # Randomizes test order every run. Earned its place: it caught a real
  # order/timing-dependent race in the Studio web test fixture that a fixed
  # order never surfaced.
  "pytest-randomly>=3,<4",
  "pytest-cov>=5,<7",
]

[project.scripts]
forge = "darkness.cli:main"
assetforge = "assetforge.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["darkness*", "assetforge*"]

[tool.setuptools.package-data]
darkness = ["profiles/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
