[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vettedmesh"
version = "0.2.0rc1"
description = "Auditable, human-gated orchestration for local AI-assisted 3D assets."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_LICENSES.md"]
authors = [
  { name = "Oney Erge", email = "48371335+iodriller@users.noreply.github.com" },
]
keywords = ["3d", "asset-pipeline", "blender", "comfyui", "human-in-the-loop", "provenance"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: GPU :: NVIDIA CUDA",
  "Framework :: Pydantic :: 2",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Graphics :: 3D Modeling",
]
dependencies = [
  "httpx>=0.27,<1",
  "networkx>=3,<4",
  "numpy>=1.26,<3",
  "Pillow>=12.3,<13",
  "pydantic>=2.8,<3",
  "trimesh>=4.4,<5",
]

[project.optional-dependencies]
local-ai = [
  # Required by adapters/install_qwen_image_edit_models.py. Keep heavyweight
  # ComfyUI/PyTorch dependencies in ComfyUI's own isolated environment.
  "huggingface-hub>=0.27,<2",
]
dev = [
  "build>=1.3,<2",
  "pip-audit>=2.10,<3",
  "pytest>=9.0.3,<10",
  # Randomizes test order every run. Earned its place: it caught a real
  # order/timing-dependent race in the Studio web test fixture that a fixed
  # order never surfaced.
  "pytest-randomly>=3,<4",
  "pytest-cov>=5,<7",
]

[project.scripts]
vettedmesh = "darkness.cli:main"
forge = "darkness.cli:main"
assetforge = "assetforge.cli:main"

[project.urls]
Homepage = "https://github.com/iodriller/vettedmesh"
Documentation = "https://github.com/iodriller/vettedmesh#readme"
Issues = "https://github.com/iodriller/vettedmesh/issues"
Source = "https://github.com/iodriller/vettedmesh"

[tool.setuptools.packages.find]
where = ["."]
include = ["darkness*", "assetforge*"]

[tool.setuptools]
py-modules = ["vettedmesh_paths"]

[tool.setuptools.package-data]
darkness = ["profiles/*.toml"]

# The live compiler invokes these files through typed subprocess contracts.
# Source checkouts use the repository copies; wheels install the identical
# tree under <environment>/share/vettedmesh, resolved by vettedmesh_paths.py.
[tool.setuptools.data-files]
"share/vettedmesh/adapters" = ["adapters/*.py"]
"share/vettedmesh/blender" = ["blender/*.py"]
"share/vettedmesh/workers" = ["workers/*.json"]
"share/vettedmesh/registry" = ["registry/*.json"]
"share/vettedmesh/motion_library" = ["motion_library/*.example.json"]
"share/vettedmesh/presets" = ["presets/*.json"]
"share/vettedmesh/assets" = ["assets/*.json"]
"share/vettedmesh/configs" = ["configs/*.json"]
"share/vettedmesh/characters" = ["characters/*.json"]
"share/vettedmesh/creatures" = ["creatures/*.json"]
"share/vettedmesh/creatures/families" = ["creatures/families/*.json"]
"share/vettedmesh/genesis/families" = ["genesis/families/*.json"]
"share/vettedmesh/golden" = ["golden/*.json"]
"share/vettedmesh/qualifications" = ["qualifications/*.json"]
"share/vettedmesh/compat/diso" = ["compat/diso/README.md"]
"share/vettedmesh/compat/diso/diso" = ["compat/diso/diso/*.py"]
"share/vettedmesh/unity_smoke_template/Assets/Editor" = ["unity_smoke_template/Assets/Editor/*.cs", "unity_smoke_template/Assets/Editor/*.meta"]
"share/vettedmesh/unity_smoke_template/Packages" = ["unity_smoke_template/Packages/*.json"]
"share/vettedmesh/unity_smoke_template/ProjectSettings" = ["unity_smoke_template/ProjectSettings/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
