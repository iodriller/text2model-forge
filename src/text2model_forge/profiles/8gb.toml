# An 8 GB consumer card, end to end.
#
# These values are not independent knobs. They are one decision -- "this is
# an 8 GB machine running ComfyUI and the reviewer at the same time" -- and
# every setting below follows from it. Picking them one at a time is what
# made the original bring-up take ten failed runs.
#
# Derived and verified on an RTX 3080 Laptop (8 GB, 39 GB system RAM).
# `python -m text2model_forge doctor` recomputes all of it from your actual hardware
# and tells you where this profile disagrees with your machine.

[studio]
# 4B, not 8B, and this is a capacity decision rather than a quality one.
# ComfyUI's process keeps ~2.2 GB of CUDA context and allocator pools even
# after /free unloads its models, so the reviewer's real budget on an 8 GB
# card is ~5.2 GB. An 8B (~6.3 GB) therefore spills to CPU, and a vision
# tower on CPU is ~100x slower: measured >600 s per review versus 15.7 s
# once it fits. Use any 3-4B vision model your endpoint serves.
model = "qwen3-vl:4b-instruct"
localdeploy_url = "http://127.0.0.1:11434/v1"

# Below ~27B the single-call StudioAssetSpec compile returns `equipment: []`
# -- schema-valid, semantically empty -- and fails D0's handedness contract.
# The chunked compiler composes the same spec from many small calls instead;
# a 4B satisfies the full contract in 7-11 s. See src/text2model_forge/chunked_spec.py.
spec_strategy = "chunked"

# Evict the other service before each call. Costs a model reload per switch,
# which is the correct trade when the alternative is running on CPU.
vram_handoff = true

# A local small model generating a multi-array chunk is legitimately slower
# than a hosted endpoint; a timeout here is indistinguishable at the gate
# from a real model failure.
llm_timeout_seconds = 900

[asset]
quality = "standard"

[stages.D2]
# Hunyuan3D-2 is the image-to-3D backend measured on this project's 8 GB-class
# ComfyUI path. That observation does not qualify every card or the complete
# D0-D10 chain. TRELLIS.2-4B's official requirement is substantially higher.
# Hunyuan is an isosurface generator, which makes the D3 settings below
# necessary, and its community license must be accepted separately.
backend = "hunyuan3d"
checkpoint = "hunyuan3d-dit-v2_fp16.safetensors"

[stages.D3]
# Hunyuan3D's surface-net decode emits a non-manifold mesh: 30,258
# non-manifold edges on a real knight. D3's welder is not a remesher and got
# that to 28,491 -- a 6% dent -- because a non-manifold edge has three or
# more faces on it and no duplicate vertices to merge. Voxel remeshing
# rebuilds the topology and reached 0 in 0.5 s on CPU.
manifold_policy = "if_needed"

# 0.003 of the longest axis is ~5.4 mm on a 1.8 m character. Chosen from the
# smallest feature that must stay topologically SEPARATE, not from how the
# silhouette looks: D7's grip builder searches the mesh near the hand for
# distinct finger branches, and voxels coarser than about half a finger
# width (~7.5 mm) fuse them into a mitt. That failure surfaces four stages
# later as "grip topology did not resolve the expected digit branches: []".
voxel_fraction = 0.003

# A rebuild legitimately changes more pixels than a weld does. Measured on
# the knight: front 1.5%, back 2.9%, left 14.0%, right 12.7%, and flat
# across voxel sizes, so it is the rebuild rather than lost resolution.
# Identity is still enforced by D3's Qwen review against the approved
# concept and by the human gate at D4.
maximum_material_change_fraction_remeshed = 0.25

[stages.D4]
# Bone-heat weighting on a remeshed character is minutes of CPU work.
timeout_seconds = 3600

[stages.D7]
# Retargeting plus four Blender render passes.
timeout_seconds = 5400
